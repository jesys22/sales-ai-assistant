<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">Sales AI</div>
        <div class="brand-sub">RAG · Qwen 2.5 Coder</div>
      </div>
    </div>

    <div class="section grow">
      <div class="section-label">Источники</div>
      <div id="sources" class="sources">
        <div class="empty">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span>Появятся после ответа</span>
        </div>
      </div>
    </div>

    <div class="info-card">
      <div class="info-row">
        <span class="info-key">База знаний</span>
        <span class="info-val">4 документа</span>
      </div>
      <div class="info-row">
        <span class="info-key">Embeddings</span>
        <span class="info-val">e5-large · 1024</span>
      </div>
      <div class="info-row">
        <span class="info-key">LLM</span>
        <span class="info-val">Qwen 2.5 · local</span>
      </div>
    </div>

    <div class="footer">
      <div class="footer-row">
        <span class="dot"></span>
        <span>API работает</span>
      </div>
      <button class="link-btn" onclick="clearChat()">Очистить</button>
    </div>
  </aside>

  <main class="main">
    <div class="messages-wrap">
      <div class="messages" id="messages">
        <div id="welcome" class="welcome">
          <div class="welcome-mark">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <h1 class="welcome-title">Чем помочь клиенту?</h1>
          <p class="welcome-sub">Задайте вопрос или выберите готовый сценарий</p>

          <div class="welcome-grid">
            <button class="welcome-tile" onclick="askQuick('Сколько стоит доставка в Москву?')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
              </svg>
              <span>Сколько стоит доставка?</span>
            </button>
            <button class="welcome-tile" onclick="askQuick('Как вернуть товар?')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
              </svg>
              <span>Как вернуть товар?</span>
            </button>
            <button class="welcome-tile" onclick="askQuick('Какие есть наушники?')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/>
              </svg>
              <span>Что есть из наушников?</span>
            </button>
            <button class="welcome-tile" onclick="askQuick('Можно оплатить картой?')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>
              </svg>
              <span>Способы оплаты?</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-wrap">
        <div class="composer-inner">
          <textarea
            id="question"
            rows="1"
            placeholder="Напишите вопрос клиента…"
            onkeydown="handleKey(event)"
            oninput="autoGrow(this)"
          ></textarea>
          <button id="sendBtn" onclick="sendQuestion()" aria-label="Отправить">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <div class="meta">
          <div class="chip">
            <span class="chip-key">latency</span>
            <span class="chip-val" id="metric-latency">—</span>
          </div>
          <div class="chip">
            <span class="chip-key">agent</span>
            <span class="chip-val" id="metric-agent">—</span>
          </div>
        </div>
      </div>
    </div>
  </main>

</div>

<!-- Модальное окно для просмотра полного текста источника -->
<div class="modal" id="sourceModal" onclick="if(event.target===this) closeSourceModal()">
  <div class="modal-inner">
    <div class="modal-head">
      <h3 class="modal-title" id="modalTitle"></h3>
      <div class="modal-actions">
        <span class="modal-score" id="modalScore"></span>
        <button class="modal-close" onclick="closeSourceModal()" aria-label="Закрыть">✕</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
